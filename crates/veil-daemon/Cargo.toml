[package]
name = "veil-daemon"
description = "Veil daemon: HTTP service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "veild"

[[bin]]
name = "veild"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
# Wire models of the Bitwarden client API. They carry no crypto (deny.toml checks it).
bitwarden-api-api = "=4.0.0"
bitwarden-api-identity = "=4.0.0"
clap = { workspace = true }
ed25519-dalek = { workspace = true }
jsonwebtoken = "9"
ureq = { workspace = true }
rand_core = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
# TOTP for Bitwarden two-step login (RFC 6238).
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
veil-proto = { workspace = true }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
tower = { workspace = true }

[lints]
workspace = true
