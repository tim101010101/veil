[package]
name = "veil-cli"
description = "Veil command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
flate2 = "1"
jiff = "0.2"
tar = "0.4"
semver = "1"
data-encoding = "2"
nix = { version = "0.30", features = ["fs", "term"] }
terminal_size = "0.4"
rand_core = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }
veil-core = { workspace = true }
veil-presence = { workspace = true }
veil-proto = { workspace = true }

# Runs the child on a pseudo-terminal so output to a terminal can be redacted.
portable-pty = "0.9"
# Shows the two-step secret to an authenticator app as a terminal QR code.
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The device and account keys live in the login keychain.
security-framework = "3"

[dev-dependencies]
assert_cmd = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
rand_core = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
serde_json = { workspace = true }

[lints]
workspace = true
