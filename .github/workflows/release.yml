name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py check-tag "$TAG"
          git merge-base --is-ancestor HEAD origin/main

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Verify the complete release
        env:
          TAG: ${{ github.ref_name }}
          VEIL_BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release.py check-tag "$TAG"
          python3 scripts/release.py verify --directory dist --commit "$VEIL_BUILD_COMMIT"
      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "Veil $TAG" --notes-file "docs/releases/${TAG#v}.md"
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false --latest
