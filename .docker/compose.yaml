name: veil
services:
  veild:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    volumes:
      - veil-data:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  veil-data:
